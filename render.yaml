services:
  - type: web
    name: prototype-stackoverflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:*,http://127.0.0.1:*
