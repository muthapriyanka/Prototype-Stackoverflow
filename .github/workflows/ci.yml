name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven verification
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stackoverflow-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stackoverflow-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build
        env:
          CI: "true"

  containers:
    name: Build ${{ matrix.name }} image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: stackoverflow-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: prototype-stackoverflow-${{ matrix.name }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to AWS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://prototype-stackoverflow-alb-1028424928.us-east-2.elb.amazonaws.com
    env:
      AWS_REGION: us-east-2
      ECR_REGISTRY: 448895342297.dkr.ecr.us-east-2.amazonaws.com
      BACKEND_IMAGE: 448895342297.dkr.ecr.us-east-2.amazonaws.com/prototype-stackoverflow-backend
      FRONTEND_IMAGE: 448895342297.dkr.ecr.us-east-2.amazonaws.com/prototype-stackoverflow-frontend
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:us-east-2:448895342297:targetgroup/prototype-stackoverflow-app/20479bb3c45f128a
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: stackoverflow-frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Roll out application nodes
        shell: bash
        run: |
          set -euo pipefail

          for instance_id in i-099c4a3e76d5483e9 i-0d2ea9704288ed07d; do
            deploy_command="cd /opt/stackoverflow/app && git fetch origin main && git checkout --force $GITHUB_SHA && chmod +x scripts/deploy-app-node.sh && AWS_REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY BACKEND_IMAGE=$BACKEND_IMAGE FRONTEND_IMAGE=$FRONTEND_IMAGE APP_IMAGE_TAG=$GITHUB_SHA scripts/deploy-app-node.sh"
            parameters=$(jq -cn --arg command "$deploy_command" '{commands: [$command]}')

            command_id=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$instance_id" \
              --document-name AWS-RunShellScript \
              --comment "Deploy $GITHUB_SHA" \
              --parameters "$parameters" \
              --query 'Command.CommandId' \
              --output text)

            if ! aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$instance_id"; then
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$instance_id"
              exit 1
            fi

            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'StandardOutputContent' \
              --output text

            aws elbv2 wait target-in-service \
              --region "$AWS_REGION" \
              --target-group-arn "$TARGET_GROUP_ARN" \
              --targets "Id=$instance_id,Port=80"
          done

      - name: Verify deployed version through load balancer
        run: |
          response=$(curl --fail --silent \
            http://prototype-stackoverflow-alb-1028424928.us-east-2.elb.amazonaws.com/api/actuator/info)
          echo "$response"
          [[ "$response" == *"$GITHUB_SHA"* ]]
